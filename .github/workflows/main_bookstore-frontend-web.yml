# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - bookstore-frontend-web

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '24.x'

      # CẢI TIẾN QUAN TRỌNG NHẤT: Chạy npm trong thư mục frontend
      - name: npm install, build, and test
        run: |
          npm install
          npm run build --if-present
          npm run test --if-present
        working-directory: frontend # <--- THÊM DÒNG NÀY ĐỂ CHẠY LỆNH TRONG THƯ MỤC 'frontend'

      # CẢI TIẾN: Chỉ upload thư mục 'dist' đã được build
      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: frontend/dist # <--- SỬA ĐƯỜNG DẪN TỪ '.' SANG 'frontend/dist'

  deploy:
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app # Tên artifact
          path: . # Download nội dung artifact vào thư mục gốc của job deploy

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'bookstore-frontend-web'
          slot-name: 'Production'
          # Package hiện tại chỉ chứa nội dung thư mục 'dist', nên chỉ cần deploy '.'
          package: . 
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_C78902685CBE4D9896A145F512B0A14F }}